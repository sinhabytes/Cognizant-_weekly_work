<div class="home-page">

  <div class="header-section">
    <h1 class="welcome-heading">
      Welcome to {{ portalName }}
    </h1>

    <p class="description">
      Your one-stop portal to manage courses, monitor progress, and stay updated.
    </p>
  </div>

  <div class="content-layout">

    <div class="left-panel">

      <div class="stats-row">

        <div class="stat-card">
          <h3 class="stat-label">Courses Available</h3>
          <p class="stats-value">{{ availableCoursesCount }}</p>
        </div>

        <div class="stat-card">
          <h3 class="stat-label">Enrolled Courses</h3>
          <p class="stats-value">{{ enrolledCount$ | async }}</p>
        </div>

        <div class="stat-card">
          <h3 class="stat-label">Current GPA</h3>
          <p class="stats-value">8.57</p>
        </div>

      </div>

      <app-course-summary-widget></app-course-summary-widget>

    </div>

    <div class="right-panel">
      <app-notification></app-notification>
    </div>

  </div>

</div>
